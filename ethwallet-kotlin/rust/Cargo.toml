[package]
name = "ethwallet_crypto"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
bip39 = { version = "2.2.2", default-features = false, features = ["std", "zeroize"] }
bitcoin = { version = "0.32.102", default-features = false, features = ["std"] }
getrandom = "0.4.3"
sha3 = { version = "0.12.0", default-features = false }
zeroize = "1.9.0"

[target.'cfg(any(target_os = "android", target_os = "macos"))'.dependencies]
jni = "0.21.1"

[profile.release]
codegen-units = 1
debug = false
lto = "thin"
overflow-checks = true
panic = "unwind"
strip = "symbols"
